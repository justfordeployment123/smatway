services:
  postgres:
    image: postgres:16-alpine
    container_name: smatway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smatway
      POSTGRES_PASSWORD: smatway
      POSTGRES_DB: smatway
    ports:
      - "5432:5432"
    volumes:
      - smatway-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smatway -d smatway" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smatway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - smatway-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smatway-postgres-data:
  smatway-redis-data:
