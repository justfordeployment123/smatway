          - heading "Why we built this" [level=2] [ref=e47]
        - generic [ref=e48]:
          - paragraph [ref=e49]: "SmatWay was built from a straightforward observation: finding reliable transport shouldn't require luck. We watched travelers settle for uncertain options while transporters struggled to fill seats — and saw a clear gap."
          - paragraph [ref=e50]: “The hardest part of any journey shouldn't be figuring out how to get there.”
          - paragraph [ref=e51]: Our platform bridges that gap by connecting verified transporters with travelers who need reliable, affordable transportation. We've built a community grounded in trust, safety, and transparency — where both sides of a journey can operate with confidence.
          - paragraph [ref=e52]: Since launch, we've helped thousands of travelers reach their destinations safely while giving transporters a steady, manageable stream of bookings. Today, SmatWay continues to grow — connecting more communities and making travel easier for everyone.
